<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Bookmarks</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./js/app.js"></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <h1>
        <img class="app-icon" src="./favicon.svg" alt="">
        <span id="appTitle">Bookmarks</span>
      </h1>
    </header>

    <section class="toolbar" aria-label="Main toolbar" data-i18n-aria-label="toolbarLabel">
      <label class="visually-hidden" for="searchInput" data-i18n="searchLabel">Search bookmarks</label>
      <input
        id="searchInput"
        class="search-input"
        type="search"
        autocomplete="off"
        data-i18n-placeholder="searchPlaceholder"
        placeholder="Search..."
      >
      <button id="pullButton" class="button button-success" type="button" data-i18n="pullButton">⬇ Pull</button>
      <button id="pushButton" class="button" type="button" data-i18n="pushButton">⬆ Push</button>
      <button id="addButton" class="button button-warm" type="button" data-i18n="addButton">＋ Add</button>
      <button id="settingsButton" class="button button-secondary" type="button" data-i18n="settingsButton">⚙ Settings</button>
    </section>

    <p id="status" class="status" role="status" aria-live="polite"></p>
    <nav id="tagBar" class="tag-bar" aria-label="Filter bookmarks by tag" data-i18n-aria-label="tagFilterLabel"></nav>

    <section id="bookmarkGrid" class="bookmark-grid" aria-label="Bookmarks" data-i18n-aria-label="bookmarkListLabel"></section>
    <p id="emptyState" class="empty-state" hidden data-i18n="emptyBookmarks">No bookmarks yet. Add one to get started.</p>
    <footer id="meta" class="meta"></footer>
  </main>

  <!-- Settings -->
  <dialog id="settingsDialog" class="dialog">
    <form id="settingsForm" class="dialog-form">
      <h2 data-i18n="settingsTitle">Settings</h2>

      <label for="managerTitleInput" data-i18n="managerTitleLabel">Manager Title</label>
      <input
        id="managerTitleInput"
        name="managerTitle"
        type="text"
        maxlength="80"
        required
        data-i18n-placeholder="managerTitlePlaceholder"
        placeholder="Bookmarks"
      >

      <label for="listSortInput" data-i18n="listSortLabel">Bookmark Sorting</label>
      <select id="listSortInput" name="listSort">
        <option value="created-desc" data-i18n="sortCreatedDesc">Creation time · Newest first</option>
        <option value="created-asc" data-i18n="sortCreatedAsc">Creation time · Oldest first</option>
        <option value="updated-desc" data-i18n="sortUpdatedDesc">Modified time · Newest first</option>
        <option value="updated-asc" data-i18n="sortUpdatedAsc">Modified time · Oldest first</option>
        <option value="name-asc" data-i18n="sortNameAsc">Name · A to Z</option>
        <option value="name-desc" data-i18n="sortNameDesc">Name · Z to A</option>
        <option value="tag-asc" data-i18n="sortTagAsc">Tag · A to Z</option>
        <option value="tag-desc" data-i18n="sortTagDesc">Tag · Z to A</option>
      </select>

      <label for="tagSortInput" data-i18n="tagSortLabel">Tag Sorting</label>
      <select id="tagSortInput" name="tagSort">
        <option value="lastUsed-desc" data-i18n="sortTagLastUsedDesc">Last used · Most recent first</option>
        <option value="lastUsed-asc" data-i18n="sortTagLastUsedAsc">Last used · Least recent first</option>
        <option value="name-asc" data-i18n="sortTagNameAsc">Name · A to Z</option>
        <option value="name-desc" data-i18n="sortTagNameDesc">Name · Z to A</option>
        <option value="count-desc" data-i18n="sortTagCountDesc">Applied count · Most first</option>
        <option value="count-asc" data-i18n="sortTagCountAsc">Applied count · Least first</option>
      </select>

      <button id="manageTagsButton" class="button button-secondary" type="button" data-i18n="manageTagsButton">
        Manage all tags
      </button>

      <label for="gistFilenameInput" data-i18n="gistFilenameLabel">Gist Filename</label>
      <input
        id="gistFilenameInput"
        name="gistFilename"
        type="text"
        maxlength="255"
        required
        data-i18n-placeholder="gistFilenamePlaceholder"
        placeholder="bookmarks.csv"
      >
      <p class="field-hint" data-i18n="gistFilenameHint">
        Use a .csv filename. The file must follow the same bookmark CSV format.
      </p>

      <label for="gistIdInput" data-i18n="gistIdLabel">GitHub Gist ID</label>
      <input
        id="gistIdInput"
        name="gistId"
        type="text"
        autocomplete="off"
        spellcheck="false"
        data-i18n-placeholder="gistIdPlaceholder"
        placeholder="Paste your Gist ID"
      >

      <label for="tokenInput" data-i18n="tokenLabel">GitHub Token</label>
      <input
        id="tokenInput"
        name="token"
        type="password"
        autocomplete="off"
        spellcheck="false"
        data-i18n-placeholder="tokenPlaceholder"
        placeholder="Required for pushing changes"
      >
      <p class="field-hint" data-i18n="tokenHint">
        The token is only needed if a push is required.
      </p>

      <div class="dialog-actions">
        <button class="button" type="submit" data-i18n="saveButton">Save</button>
        <button class="button button-danger" id="cancelSettingsButton" type="button" data-i18n="cancelButton">Cancel</button>
      </div>
    </form>
  </dialog>

  <!-- Manage all tags -->
  <dialog id="tagManagerDialog" class="dialog">
    <div class="dialog-form">
      <h2 data-i18n="tagManagerTitle">Manage all tags</h2>
      <p class="field-hint" data-i18n="tagManagerHint">
        Edit a tag to change its name, visibility, or pinned status.
      </p>

      <div id="tagManagerList" class="tag-manager-list"></div>

      <div class="dialog-actions">
        <button id="closeTagManagerButton" class="button" type="button" data-i18n="doneButton">Done</button>
      </div>
    </div>
  </dialog>

  <!-- Edit tag -->
  <dialog id="tagEditDialog" class="dialog">
    <form id="tagEditForm" class="dialog-form">
      <h2 data-i18n="editTagTitle">Edit tag</h2>

      <label for="tagEditNameInput" data-i18n="tagNameLabel">Tag name</label>
      <input
        id="tagEditNameInput"
        name="tagName"
        type="text"
        maxlength="200"
        required
      >

      <label class="check-row" for="tagEditHiddenInput">
        <input id="tagEditHiddenInput" name="hidden" type="checkbox">
        <span data-i18n="tagHiddenSetting">Hide this tag</span>
      </label>

      <label class="check-row" for="tagEditPinnedInput">
        <input id="tagEditPinnedInput" name="pinned" type="checkbox">
        <span data-i18n="tagPinnedSetting">Pin this tag</span>
      </label>

      <div class="dialog-actions">
        <button class="button" type="submit" data-i18n="saveButton">Save</button>
        <button id="deleteTagButton" class="button button-danger" type="button" data-i18n="deleteTagButton">Delete tag</button>
        <button id="cancelTagEditButton" class="button button-secondary" type="button" data-i18n="cancelButton">Cancel</button>
      </div>
    </form>
  </dialog>

  <!-- Bookmark editor -->
  <dialog id="bookmarkDialog" class="dialog">
    <form id="bookmarkForm" class="dialog-form">
      <h2 id="bookmarkDialogTitle">Add bookmark</h2>
      <input id="bookmarkIndexInput" name="index" type="hidden" value="-1">

      <label for="nameInput" data-i18n="nameLabel">Name</label>
      <input
        id="nameInput"
        name="name"
        type="text"
        maxlength="200"
        required
        data-i18n-placeholder="namePlaceholder"
        placeholder="Bookmark name"
      >

      <label for="urlInput" data-i18n="urlLabel">URL</label>
      <input
        id="urlInput"
        name="url"
        type="url"
        inputmode="url"
        maxlength="2048"
        required
        data-i18n-placeholder="urlPlaceholder"
        placeholder="https://example.com"
      >

      <label for="descriptionInput" data-i18n="descriptionLabel">Description</label>
      <textarea
        id="descriptionInput"
        name="description"
        rows="3"
        maxlength="2000"
        data-i18n-placeholder="descriptionPlaceholder"
        placeholder="A short description"
      ></textarea>

      <label for="tagsInput" data-i18n="tagsLabel">Tags</label>
      <div id="tagPicker" class="tag-picker">
        <div class="tag-picker-control">
          <div id="selectedTags" class="selected-tags" aria-label="Selected tags" data-i18n-aria-label="selectedTagsLabel"></div>
          <input
            id="tagsInput"
            class="tag-input"
            name="tags"
            type="text"
            maxlength="200"
            autocomplete="off"
            role="combobox"
            aria-autocomplete="list"
            aria-expanded="false"
            aria-controls="tagOptions"
            data-i18n-placeholder="tagsPlaceholder"
            placeholder="Type or select tags..."
          >
        </div>
        <div id="tagOptions" class="tag-options" role="listbox" hidden></div>
      </div>

      <div class="dialog-actions">
        <button class="button" type="submit" data-i18n="saveButton">Save</button>
        <button class="button button-danger" id="cancelBookmarkButton" type="button" data-i18n="cancelButton">Cancel</button>
      </div>
    </form>
  </dialog>
</body>
</html>
